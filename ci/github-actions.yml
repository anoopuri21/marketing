# GitHub Actions workflow – copy to .github/workflows/ci.yml to enable.
# (Kept outside .github/ because the Arena GitHub connection has no `workflows` permission to push it.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend · ruff + mypy + pytest
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff mypy
      - run: ruff check app tests
      - run: ruff format --check app tests || true  # formatting is advisory for now
      - run: mypy app
      - run: python -m pytest -q

  frontend:
    name: Frontend · oxlint + tsc + build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rankpilot:ci .
